<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Timer</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="ic_launcher-playstore.png" type="image/png">
    <meta name="theme-color" content="#0ea5e9">

    <!-- CSS / Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .btn-calculate {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(245, 158, 11, 0.4);
            filter: brightness(1.1);
        }

        .btn-calculate:active {
            transform: translateY(1px);
        }

        .btn-add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .btn-remove {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            filter: saturate(1.5);
            transform: scale(1.05);
        }

        input {
            transition: all 0.2s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: #fbbf24 !important;
            outline: none;
        }
    </style>
    <!-- Compiled TS Code Bundled with canvas-confetti -->
    <script src="index.js" defer></script>
</head>

<body class="text-white p-4">

    <div class="glass-card rounded-3xl p-8 max-w-sm w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-yellow-200 to-yellow-500 bg-clip-text text-transparent">
                Shift Timer
            </h1>
            <button id="notifyBtn" class="text-white/40 hover:text-white transition duration-200 focus:outline-none p-2.5 rounded-xl bg-white/5 hover:bg-white/10" title="Toggle Shift Complete Alerts">
                <!-- Disabled Bell Icon by default -->
                <svg xmlns="http://www.w3.org/2000/svg" id="bellIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                </svg>
            </button>
        </div>
        <div id="currentTime" class="text-center text-white/40 text-sm font-medium mb-8 tabular-nums"></div>

        <!-- Login -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Login Time</label>
            <input type="time" id="loginTime" value="22:42"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner">
        </div>

        <!-- Shift -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Shift Hours</label>
            <input type="number" id="shiftHours" value="7" min="1" max="12" step="0.5"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner">
        </div>

        <!-- Break Presets -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Quick Add Breaks</label>
            <div class="flex gap-2">
                <button class="preset-btn flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-teal-300" data-minutes="15">
                    +15m
                </button>
                <button class="preset-btn flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-emerald-300" data-minutes="30">
                    +30m (Lunch)
                </button>
                <button class="preset-btn flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-yellow-300" data-minutes="45">
                    +45m
                </button>
            </div>
        </div>

        <!-- Breaks Container -->
        <div class="mb-4" id="breaks">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Breaks (minutes)</label>
            <div class="flex gap-3 mb-3">
                <input type="number"
                    class="breakInput flex-1 p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner"
                    placeholder="Min">
                <button class="btn-remove w-14 flex items-center justify-center rounded-2xl text-xl font-bold shadow-lg">−</button>
            </div>
        </div>

        <!-- Actions -->
        <button id="addBreakBtn"
            class="btn-add w-full mb-6 py-4 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-lg flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                    clip-rule="evenodd" />
            </svg>
            Add Break
        </button>

        <button id="calculateBtn"
            class="btn-calculate w-full text-black h-16 rounded-2xl font-extrabold text-lg uppercase tracking-wider mb-8 flex items-center justify-center">
            Calculate
        </button>

        <!-- Visual Timeline -->
        <div id="timelineContainer" class="mb-8 hidden">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-3 ml-1">Shift Progress</label>
            <div class="relative w-full h-4 bg-white/5 rounded-full overflow-hidden border border-white/10 p-0.5">
                <div id="timelineBar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-1000" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-[11px] text-white/40 mt-2.5 px-1">
                <span id="timelineStart">Start</span>
                <span id="timelinePercent" class="font-bold text-yellow-400">0%</span>
                <span id="timelineEnd">End</span>
            </div>
        </div>

        <!-- Result -->
        <div id="display" class="text-xl font-bold text-center mb-4 transition-all duration-500"></div>
        <div id="timeLeft"
            class="p-5 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl text-center font-bold text-emerald-300 hidden">
        </div>
    </div>

</body>

</html>
