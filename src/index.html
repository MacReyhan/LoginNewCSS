<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Timer</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="ic_launcher-playstore.png" type="image/png">
    <meta name="theme-color" content="#0ea5e9">

    <!-- CSS / Tailwind & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .btn-calculate {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(245, 158, 11, 0.4);
            filter: brightness(1.1);
        }

        .btn-calculate:active {
            transform: translateY(1px);
        }

        .btn-add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .btn-remove {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            filter: saturate(1.5);
            transform: scale(1.05);
        }

        input {
            transition: all 0.2s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: #fbbf24 !important;
            outline: none;
        }
    </style>
</head>

<body class="text-white p-4">

    <div class="glass-card rounded-3xl p-8 max-w-sm w-full">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-yellow-200 to-yellow-500 bg-clip-text text-transparent">
                Shift Timer
            </h1>
            <button id="notifyBtn" onclick="toggleNotifications()" class="text-white/40 hover:text-white transition duration-200 focus:outline-none p-2.5 rounded-xl bg-white/5 hover:bg-white/10" title="Toggle Shift Complete Alerts">
                <!-- Disabled Bell Icon by default -->
                <svg xmlns="http://www.w3.org/2000/svg" id="bellIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                </svg>
            </button>
        </div>
        <div id="currentTime" class="text-center text-white/40 text-sm font-medium mb-8 tabular-nums"></div>

        <!-- Login -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Login Time</label>
            <input type="time" id="loginTime" value="22:42" oninput="saveState(); updateDisplay(false)"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner">
        </div>

        <!-- Shift -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Shift Hours</label>
            <input type="number" id="shiftHours" value="7" min="1" max="12" step="0.5" oninput="saveState(); updateDisplay(false)"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner">
        </div>

        <!-- Break Presets -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Quick Add Breaks</label>
            <div class="flex gap-2">
                <button onclick="addPresetBreak(15)" class="flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-teal-300">
                    +15m
                </button>
                <button onclick="addPresetBreak(30)" class="flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-emerald-300">
                    +30m (Lunch)
                </button>
                <button onclick="addPresetBreak(45)" class="flex-1 py-2 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/25 text-xs font-semibold transition duration-200 text-yellow-300">
                    +45m
                </button>
            </div>
        </div>

        <!-- Breaks Container -->
        <div class="mb-4" id="breaks">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-2 ml-1">Breaks (minutes)</label>
            <div class="flex gap-3 mb-3">
                <input type="number" oninput="saveState(); updateDisplay(false)"
                    class="breakInput flex-1 p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner"
                    placeholder="Min">
                <button onclick="removeBreak(this)"
                    class="btn-remove w-14 flex items-center justify-center rounded-2xl text-xl font-bold shadow-lg">−</button>
            </div>
        </div>

        <!-- Actions -->
        <button onclick="addBreak()"
            class="btn-add w-full mb-6 py-4 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-lg flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                    clip-rule="evenodd" />
            </svg>
            Add Break
        </button>

        <button onclick="updateDisplay(true); saveState()"
            class="btn-calculate w-full text-black h-16 rounded-2xl font-extrabold text-lg uppercase tracking-wider mb-8 flex items-center justify-center">
            Calculate
        </button>

        <!-- Visual Timeline -->
        <div id="timelineContainer" class="mb-8 hidden">
            <label class="block text-xs font-semibold uppercase tracking-wider text-white/50 mb-3 ml-1">Shift Progress</label>
            <div class="relative w-full h-4 bg-white/5 rounded-full overflow-hidden border border-white/10 p-0.5">
                <div id="timelineBar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-1000" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-[11px] text-white/40 mt-2.5 px-1">
                <span id="timelineStart">Start</span>
                <span id="timelinePercent" class="font-bold text-yellow-400">0%</span>
                <span id="timelineEnd">End</span>
            </div>
        </div>

        <!-- Result -->
        <div id="display" class="text-xl font-bold text-center mb-4 transition-all duration-500"></div>
        <div id="timeLeft"
            class="p-5 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl text-center font-bold text-emerald-300 hidden">
        </div>
    </div>

    <script>
        // State management
        let alertTriggered = false;
        let notificationsEnabled = false;
        let showResults = false;
        let audioCtx = null;

        // Update current time every second
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const currentTimeEl = document.getElementById('currentTime');
            if (currentTimeEl) {
                currentTimeEl.textContent = `Current Time: ${timeStr}`;
            }

            // Auto-refresh calculation if it has been run at least once
            const timeLeftEl = document.getElementById('timeLeft');
            if (timeLeftEl && !timeLeftEl.classList.contains('hidden')) {
                updateDisplay(false);
            }
        }
        setInterval(updateClock, 1000);

        // Run immediately on load
        window.addEventListener('load', () => {
            updateClock();
            loadState();
            // Restore notification choice from local storage
            const savedNotif = localStorage.getItem('shiftTimerNotifications');
            if (savedNotif === 'true' && Notification.permission === 'granted') {
                notificationsEnabled = true;
                updateBellIcon(true);
            }
        });

        // Add break
        function addBreak(value = "") {
            const breaksDiv = document.getElementById('breaks');
            const newBreak = document.createElement('div');
            newBreak.className = 'flex gap-3 mb-3';
            newBreak.innerHTML = `
                <input type="number" class="breakInput flex-1 p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner" placeholder="Min" value="${value}" oninput="saveState(); updateDisplay(false)">
                <button onclick="removeBreak(this)" class="btn-remove w-14 flex items-center justify-center rounded-2xl text-xl font-bold shadow-lg">−</button>
            `;
            breaksDiv.appendChild(newBreak);
            saveState();
            updateDisplay(false);
        }

        // Add break preset
        function addPresetBreak(min) {
            addBreak(min);
        }

        // Remove break
        function removeBreak(button) {
            button.parentElement.remove();
            saveState();
            updateDisplay(false);
        }

        // Save State
        function saveState() {
            const loginTime = document.getElementById('loginTime').value;
            const shiftHours = document.getElementById('shiftHours').value;
            const breaks = Array.from(document.querySelectorAll('.breakInput')).map(input => input.value);
            
            const state = { loginTime, shiftHours, breaks, showResults };
            localStorage.setItem('shiftTimerState', JSON.stringify(state));
        }

        // Load State
        function loadState() {
            const stateStr = localStorage.getItem('shiftTimerState');
            if (!stateStr) return;
            try {
                const state = JSON.parse(stateStr);
                if (state.loginTime) document.getElementById('loginTime').value = state.loginTime;
                if (state.shiftHours) document.getElementById('shiftHours').value = state.shiftHours;
                
                if (state.breaks && state.breaks.length > 0) {
                    const breaksContainer = document.getElementById('breaks');
                    breaksContainer.querySelectorAll('.flex').forEach(el => el.remove());
                    
                    state.breaks.forEach((val) => {
                        const newBreak = document.createElement('div');
                        newBreak.className = 'flex gap-3 mb-3';
                        newBreak.innerHTML = `
                            <input type="number" class="breakInput flex-1 p-4 rounded-2xl bg-white/10 border border-white/20 text-lg font-medium shadow-inner" placeholder="Min" value="${val}" oninput="saveState(); updateDisplay(false)">
                            <button onclick="removeBreak(this)" class="btn-remove w-14 flex items-center justify-center rounded-2xl text-xl font-bold shadow-lg">−</button>
                        `;
                        breaksContainer.appendChild(newBreak);
                    });
                }
                showResults = state.showResults || false;
                if (showResults) {
                    updateDisplay(false);
                }
            } catch (e) {
                console.error("Error loading stored state:", e);
            }
        }

        // Play chime sound using Web Audio API
        function playChime() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const now = audioCtx.currentTime;
                
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.05); // E5
                osc2.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc1.start(now);
                osc1.stop(now + 0.8);
                
                osc2.start(now + 0.05);
                osc2.stop(now + 0.85);
            } catch (e) {
                console.error("Failed to play audio chime alert:", e);
            }
        }

        // Toggle notifications
        function toggleNotifications() {
            if (Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        notificationsEnabled = true;
                        updateBellIcon(true);
                        localStorage.setItem('shiftTimerNotifications', 'true');
                        new Notification("Notifications Enabled!", {
                            body: "Shift Timer will now notify you when your shift ends.",
                            icon: "ic_launcher-playstore.png"
                        });
                    } else {
                        notificationsEnabled = false;
                        updateBellIcon(false);
                        localStorage.setItem('shiftTimerNotifications', 'false');
                    }
                });
            } else if (Notification.permission === 'granted') {
                notificationsEnabled = !notificationsEnabled;
                updateBellIcon(notificationsEnabled);
                localStorage.setItem('shiftTimerNotifications', notificationsEnabled ? 'true' : 'false');
            } else {
                alert("Notification permission is blocked. Please enable notifications in your browser settings.");
                updateBellIcon(false);
                localStorage.setItem('shiftTimerNotifications', 'false');
            }
        }

        function updateBellIcon(enabled) {
            const bellIcon = document.getElementById('bellIcon');
            const notifyBtn = document.getElementById('notifyBtn');
            if (enabled) {
                notifyBtn.classList.remove('text-white/40');
                notifyBtn.classList.add('text-yellow-400', 'bg-yellow-400/10');
                bellIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                `;
            } else {
                notifyBtn.classList.add('text-white/40');
                notifyBtn.classList.remove('text-yellow-400', 'bg-yellow-400/10');
                bellIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                `;
            }
        }

        // Calculations & UI display update
        function updateDisplay(showAnimation = true) {
            const loginTime = document.getElementById('loginTime').value;
            const shiftHoursInput = document.getElementById('shiftHours').value;
            const shiftHours = parseFloat(shiftHoursInput) || 0;
            const breaks = Array.from(document.querySelectorAll('.breakInput')).map(input => parseInt(input.value) || 0);
            const totalBreakMinutes = breaks.reduce((a, b) => a + b, 0);

            if (!loginTime) return;
            if (showAnimation) {
                showResults = true;
            }

            const [loginH, loginM] = loginTime.split(':').map(Number);
            const totalShiftMinutes = (shiftHours * 60) + totalBreakMinutes;

            // Calculate Logout Time
            let endTotalMinutes = (loginH * 60) + loginM + totalShiftMinutes;
            let endH = Math.floor(endTotalMinutes / 60) % 24;
            let endM = endTotalMinutes % 60;

            const endTimeStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
            const displayEl = document.getElementById('display');
            displayEl.textContent = `Logout Time: ${endTimeStr}`;

            if (showAnimation) {
                displayEl.classList.add('scale-110');
                setTimeout(() => displayEl.classList.remove('scale-110'), 200);
            }

            // Date setup
            const now = new Date();
            let startDate = new Date(now);
            startDate.setHours(loginH, loginM, 0, 0);

            // Handle shift crossing midnight
            if (startDate - now > 12 * 60 * 60 * 1000) {
                startDate.setDate(startDate.getDate() - 1);
            }

            const logoutDate = new Date(startDate.getTime() + totalShiftMinutes * 60000);
            const diff = logoutDate - now;

            // Update Progress Bar
            const totalDuration = totalShiftMinutes * 60000;
            const elapsed = now - startDate;
            let percent = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));

            const timelineContainer = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const timelinePercent = document.getElementById('timelinePercent');
            const timelineStart = document.getElementById('timelineStart');
            const timelineEnd = document.getElementById('timelineEnd');

            timelineContainer.classList.remove('hidden');
            timelineStart.textContent = `Login: ${loginTime}`;
            timelineEnd.textContent = `Logout: ${endTimeStr}`;

            if (percent >= 100) {
                timelineBar.style.width = '100%';
                timelineBar.className = 'h-full rounded-full bg-gradient-to-r from-rose-500 to-red-600 transition-all duration-1000';
                timelinePercent.textContent = `100% (Completed)`;
            } else if (percent >= 90) {
                timelineBar.style.width = `${percent}%`;
                timelineBar.className = 'h-full rounded-full bg-gradient-to-r from-amber-400 to-orange-500 transition-all duration-1000';
                timelinePercent.textContent = `${Math.floor(percent)}%`;
            } else {
                timelineBar.style.width = `${percent}%`;
                timelineBar.className = 'h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-1000';
                timelinePercent.textContent = `${Math.floor(percent)}%`;
            }

            // Update Time Left / Overtime outputs
            const timeLeftEl = document.getElementById('timeLeft');
            if (diff <= 0) {
                const absDiff = Math.abs(diff);
                const otH = Math.floor(absDiff / 3600000);
                const otM = Math.floor((absDiff % 3600000) / 60000);
                const otS = Math.floor((absDiff % 60000) / 1000);

                timeLeftEl.textContent = `Shift Ended! (Overtime: ${otH}h ${otM}m ${otS}s)`;
                timeLeftEl.classList.add('bg-rose-500/20', 'text-rose-300', 'border-rose-500/30');
                timeLeftEl.classList.remove('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30');

                // Trigger Alarm
                if (!alertTriggered) {
                    playChime();
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                    if (notificationsEnabled) {
                        new Notification("Shift Complete! 🎉", {
                            body: `Your shift ended at ${endTimeStr}. It's time to log out!`,
                            icon: "ic_launcher-playstore.png"
                        });
                    }
                    alertTriggered = true;
                }
            } else {
                const diffHours = Math.floor(diff / 3600000);
                const diffMinutes = Math.floor((diff % 3600000) / 60000);
                const diffSeconds = Math.floor((diff % 60000) / 1000);

                timeLeftEl.textContent = `Time Left: ${diffHours}h ${diffMinutes}m ${diffSeconds}s`;
                timeLeftEl.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30');
                timeLeftEl.classList.remove('bg-rose-500/20', 'text-rose-300', 'border-rose-500/30');
                
                alertTriggered = false; // Reset alert trigger if time added
            }
            timeLeftEl.classList.remove('hidden');
        }
    </script>
</body>

</html>
